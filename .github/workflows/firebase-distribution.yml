name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      groups:
        description: Comma-separated Firebase tester groups
        required: false
        default: testers
      release_notes:
        description: Release notes shown to testers
        required: false
        default: Manual build from GitHub Actions
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: firebase-distribution
  cancel-in-progress: false

jobs:
  distribute-android:
    name: Build and distribute Android
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tags to point to a commit on main
        if: ${{ github.event_name == 'push' }}
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/main$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release tags must be created from main."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - run: flutter pub get

      - name: Quality gate
        run: |
          flutter analyze --fatal-infos --fatal-warnings
          dart tool/check_english.dart
          flutter test

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ANDROID_${name}. Release builds must be signed."
              exit 1
            fi
          done

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify the APK is not signed with a debug key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs" | grep -E "certificate (DN|SHA-256)"
          if echo "$certs" | grep -qi "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi

      - name: Resolve distribution settings
        id: settings
        env:
          INPUT_GROUPS: ${{ github.event.inputs.groups }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "groups=testers" >> "$GITHUB_OUTPUT"
            echo "notes=Release $REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "groups=${INPUT_GROUPS:-testers}" >> "$GITHUB_OUTPUT"
            echo "notes=${INPUT_NOTES:-Manual build}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ steps.settings.outputs.groups }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ steps.settings.outputs.notes }}

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"
