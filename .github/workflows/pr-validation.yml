name: PR validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  naming:
    name: Branch and title conventions
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          branch_pattern='^(feature|bugfix|hotfix|release|chore|docs|refactor|test|ci)/[a-z0-9][a-z0-9._-]*$'

          if [ "$HEAD_BRANCH" = "develop" ] && [ "$BASE_BRANCH" = "main" ]; then
            exit 0
          fi

          if [ "$HEAD_BRANCH" = "main" ] && [ "$BASE_BRANCH" = "develop" ]; then
            exit 0
          fi

          if ! echo "$HEAD_BRANCH" | grep -qE "$branch_pattern"; then
            echo "::error::Invalid branch name '$HEAD_BRANCH'."
            echo "Expected <type>/<kebab-case-description> with type in: feature, bugfix, hotfix, release, chore, docs, refactor, test, ci."
            echo "Example: feature/add-flash-toggle"
            exit 1
          fi

          type="${HEAD_BRANCH%%/*}"
          case "$BASE_BRANCH" in
            develop)
              if [ "$type" = "release" ] || [ "$type" = "hotfix" ]; then
                echo "::error::'$type/*' branches must target main, not develop."
                exit 1
              fi
              ;;
            main)
              if [ "$type" != "release" ] && [ "$type" != "hotfix" ]; then
                echo "::error::Only release/* and hotfix/* branches (or develop) may target main; '$HEAD_BRANCH' must target develop."
                exit 1
              fi
              ;;
          esac

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" = "main" ] || [ "$HEAD_BRANCH" = "develop" ]; then
            if [ -z "$(printf '%s' "$PR_TITLE" | tr -d '[:space:]')" ]; then
              echo "::error::The PR title cannot be empty."
              exit 1
            fi
            exit 0
          fi

          if [ "$PR_TITLE" != "$HEAD_BRANCH" ]; then
            echo "::error::Invalid PR title '$PR_TITLE'. The title must be exactly the branch name: '$HEAD_BRANCH'."
            echo "GitHub fills the title with a prettified branch name (for example 'Feature/document storage'); replace it with the exact branch name."
            exit 1
          fi

      - name: Validate PR title and branch are ASCII English
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if printf '%s\n%s' "$PR_TITLE" "$HEAD_BRANCH" | LC_ALL=C grep -qP '[^\x00-\x7F]'; then
            echo "::error::PR title and branch name must be in English (ASCII only)."
            exit 1
          fi

  quality:
    name: Lint and language check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - run: flutter pub get

      - name: Static analysis (unused imports, lints)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: English-only check
        run: dart tool/check_english.dart

  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: ./scripts/check_changelog.sh "origin/${BASE_BRANCH}...HEAD"
